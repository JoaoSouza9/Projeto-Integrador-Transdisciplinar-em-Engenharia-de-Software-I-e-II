{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">E-mail</label>
  <input id="email" type="email" name="email" value="{{ email }}" required autocomplete="email">
  <label for="senha">Senha</label>
  <input id="senha" type="password" name="senha" required autocomplete="current-password">
  <button type="submit">Entrar</button>
  <p>Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</form>
{% endblock %}
