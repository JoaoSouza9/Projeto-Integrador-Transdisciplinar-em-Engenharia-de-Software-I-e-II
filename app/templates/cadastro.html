{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="nome">Nome completo</label>
  <input id="nome" name="nome" value="{{ form.get('nome', '') }}" required minlength="3" autocomplete="name">
  <label for="email">E-mail</label>
  <input id="email" type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email">
  <label for="telefone">Telefone (opcional)</label>
  <input id="telefone" name="telefone" value="{{ form.get('telefone', '') }}" inputmode="tel" autocomplete="tel">
  <label for="senha">Senha (mín. 8 caracteres)</label>
  <input id="senha" type="password" name="senha" required minlength="8" autocomplete="new-password">
  <label for="confirmar">Confirmar senha</label>
  <input id="confirmar" type="password" name="confirmar" required minlength="8" autocomplete="new-password">
  <button type="submit">Cadastrar</button>
  <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</form>
{% endblock %}
